<!DOCTYPE html>
<!-- Login page for the AlbumLux plugin. Google sends you here after login; it shows the one-time code to paste in the panel.
     (c) Ovais Hamdani, Instagram ovais_hamdani -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlbumLux login</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f4f1ec; color: #222; }
    main { max-width: 480px; margin: 12vh auto; padding: 32px 24px; background: #fff; border-radius: 12px; text-align: center;
           box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #555; line-height: 1.5; }
    #code { margin: 20px 0; padding: 14px; font: 15px/1.4 monospace; word-break: break-all; background: #f4f1ec; border-radius: 8px; }
    button { padding: 12px 28px; font-size: 16px; border: 0; border-radius: 8px; background: #1473e6; color: #fff; cursor: pointer; }
    .bad { color: #b3261e; }
    footer { margin-top: 28px; font-size: 12px; color: #888; }
    footer a { color: #888; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Almost done</h1>
  <p id="text">Click Copy, go back to Photoshop, paste the code in the panel and click <b>Finish Login</b>.</p>
  <div id="code"></div>
  <button id="copy">Copy</button>
  <footer>(c) Ovais Hamdani · Instagram <a href="https://www.instagram.com/ovais_hamdani">ovais_hamdani</a></footer>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  var code = q.get("code");
  var err = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
  var box = document.getElementById("code"), btn = document.getElementById("copy");
  if (code) {
    box.textContent = code;
  } else {
    document.getElementById("title").textContent = "Login did not finish";
    document.getElementById("text").innerHTML = '<span class="bad">' + (err ? String(err).replace(/[<>&]/g, "") : "No code was found.") +
      '</span><br>Go back to Photoshop and click Log in with Google again.';
    box.style.display = "none"; btn.style.display = "none";
  }
  btn.onclick = function () {
    function done() { btn.textContent = "Copied - now paste it in the panel"; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, select);
    else select();
    function select() { var r = document.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); done(); }
  };
</script>
</body>
</html>
